<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050816">
  <title>Portofolio</title>
  <meta name="description" content="Portofolio desain.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Di perangkat Apple dipakai font sistem (SF Pro). Inter jadi cadangan di Windows/Android. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Latar: cahaya lembut yang bergerak pelan di belakang kaca -->
  <div class="bg" aria-hidden="true">
    <i class="orb o1"></i>
    <i class="orb o2"></i>
    <i class="orb o3"></i>
  </div>

  <header class="bar wrap">
    <div class="pill glass">
      <a class="brand" id="brand" href="#">Portofolio</a>
      <div class="pill-actions">
        <button id="admin-btn" class="icon-btn" type="button" aria-label="Masuk admin" title="Admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
        <button id="pdf-btn" class="btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
          <span class="btn-label">Unduh PDF</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero glass">
      <div class="hero-text">
        <h1 id="site-name">Portofolio</h1>
        <p id="site-tagline" class="tagline"></p>
        <p id="site-about" class="about"></p>
      </div>

      <!-- Kota mini: crane membangun, kereta lewat, bola sepak, musik. Klik keretanya! -->
      <div class="scene" aria-hidden="true">
        <svg class="city" viewBox="0 0 520 330" focusable="false">
          <defs>
            <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f8e2a4"/><stop offset="1" stop-color="#d4a24b"/>
            </linearGradient>
            <linearGradient id="gBldA" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a4fd6"/><stop offset="1" stop-color="#16206a"/>
            </linearGradient>
            <linearGradient id="gBldB" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2c3db5"/><stop offset="1" stop-color="#101858"/>
            </linearGradient>
            <pattern id="net" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M5 0H0V5" fill="none" stroke="rgba(255,255,255,.4)" stroke-width=".6"/>
            </pattern>
            <clipPath id="craneClip"><rect x="0" y="84" width="520" height="190"/></clipPath>
          </defs>

          <!-- bintang -->
          <g class="stars">
            <circle cx="34" cy="34" r="1.5" style="--d:3.2s;--delay:-.4s"/>
            <circle cx="92" cy="64" r="1.1" style="--d:4.1s;--delay:-1.7s"/>
            <circle cx="150" cy="30" r="1.7" style="--d:3.6s;--delay:-2.2s"/>
            <circle cx="282" cy="30" r="1.3" style="--d:4.4s;--delay:-.9s"/>
            <circle cx="424" cy="64" r="1.2" style="--d:3.4s;--delay:-2.8s"/>
            <circle cx="470" cy="38" r="1.7" style="--d:4.8s;--delay:-1.1s"/>
            <circle cx="500" cy="98" r="1.1" style="--d:3.9s;--delay:-3.1s"/>
            <circle cx="60" cy="112" r="1.3" style="--d:4.2s;--delay:-.2s"/>
          </g>

          <!-- tanah -->
          <rect class="ground" x="0" y="270" width="520" height="60"/>
          <line class="ground-line" x1="0" y1="270" x2="520" y2="270"/>

          <!-- gedung 1: jendela lengkung, atap datar -->
          <rect class="bld a" x="122" y="170" width="58" height="100" rx="4" data-cols="3" data-rows="4" data-arch="1"/>
          <rect class="ledge" x="118" y="166" width="66" height="6" rx="3"/>

          <!-- gedung 2: menara jam beratap lancip -->
          <rect class="bld b" x="190" y="118" width="46" height="152" rx="3" data-cols="2" data-rows="5" data-pt="34"/>
          <polygon class="gold" points="186,118 213,74 240,118"/>
          <line class="gold-line" x1="213" y1="74" x2="213" y2="62"/>
          <circle class="clock-face" cx="213" cy="134" r="8"/>
          <line class="hand hand-h" x1="213" y1="134" x2="213" y2="129"/>
          <line class="hand hand-m" x1="213" y1="134" x2="213" y2="127.5"/>

          <!-- gedung 3: sedang dibangun -->
          <rect class="bld a" x="246" y="206" width="64" height="64" rx="3" data-cols="3" data-rows="2" data-pt="12"/>
          <rect class="slot" x="246" y="156" width="64" height="50" rx="3"/>
          <g class="floor">
            <rect class="bld a" x="246" y="156" width="64" height="50" rx="3"/>
            <rect class="win on" x="256" y="172" width="7" height="9" rx="2"/>
            <rect class="win on" x="274.5" y="172" width="7" height="9" rx="2"/>
            <rect class="win on" x="293" y="172" width="7" height="9" rx="2"/>
          </g>

          <!-- gedung 4: antena berkedip -->
          <rect class="bld b" x="352" y="150" width="58" height="120" rx="4" data-cols="3" data-rows="5"/>
          <line class="gold-line" x1="381" y1="150" x2="381" y2="130"/>
          <circle class="beacon" cx="381" cy="127" r="2.8"/>

          <!-- gedung 5: kubah dengan bendera -->
          <rect class="bld a" x="420" y="190" width="78" height="80" rx="3" data-cols="4" data-rows="3" data-pt="10"/>
          <path class="gold" d="M420 190A39 39 0 0 1 498 190Z"/>
          <path class="dome-rib" d="M459 151V190M459 151C447 160 443 176 443 190M459 151C471 160 475 176 475 190"/>
          <line class="gold-line" x1="459" y1="151" x2="459" y2="133"/>
          <polygon class="flag" points="459,133 473,137.5 459,142"/>

          <!-- jendela dibuat oleh app.js -->
          <g id="wins"></g>

          <!-- crane -->
          <g class="crane">
            <path id="lattice" class="lattice" d=""/>
            <rect class="mast" x="332" y="78" width="8" height="192"/>
            <rect class="crane-base" x="324" y="264" width="24" height="6" rx="2"/>
            <g class="jib">
              <polygon class="tower-top" points="327,78 336,52 345,78"/>
              <line class="tie" x1="336" y1="52" x2="248" y2="77"/>
              <line class="tie" x1="336" y1="52" x2="392" y2="77"/>
              <rect class="jib-arm" x="238" y="76" width="160" height="5" rx="2"/>
              <rect class="counter" x="380" y="81" width="18" height="14" rx="3"/>
              <rect class="crane-cab" x="326" y="80" width="14" height="10" rx="2"/>
            </g>
            <g clip-path="url(#craneClip)">
              <g class="hook">
                <line class="rope" x1="278" y1="-200" x2="278" y2="104"/>
                <line class="rope" x1="278" y1="104" x2="250" y2="109"/>
                <line class="rope" x1="278" y1="104" x2="306" y2="109"/>
                <circle class="hookdot" cx="278" cy="104" r="3"/>
                <g class="blk">
                  <rect class="blk-rect" x="246" y="108" width="64" height="46" rx="3"/>
                  <rect class="win on" x="256" y="122" width="7" height="9" rx="2"/>
                  <rect class="win on" x="274.5" y="122" width="7" height="9" rx="2"/>
                  <rect class="win on" x="293" y="122" width="7" height="9" rx="2"/>
                </g>
              </g>
            </g>
          </g>

          <!-- percikan "ta-da!" saat lantai terpasang -->
          <g transform="translate(246 156)"><path class="spark" style="animation-delay:0s" d="M0-5L1.4-1.4 5 0 1.4 1.4 0 5-1.4 1.4-5 0-1.4-1.4Z"/></g>
          <g transform="translate(310 156)"><path class="spark" style="animation-delay:.12s" d="M0-5L1.4-1.4 5 0 1.4 1.4 0 5-1.4 1.4-5 0-1.4-1.4Z"/></g>
          <g transform="translate(278 148)"><path class="spark" style="animation-delay:.24s" d="M0-6L1.7-1.7 6 0 1.7 1.7 0 6-1.7 1.7-6 0-1.7-1.7Z"/></g>

          <!-- gawang + bola sepak -->
          <rect class="net" x="12" y="240" width="26" height="30"/>
          <path class="goal-frame" d="M12 270V240H38V270"/>
          <ellipse class="ball-shadow" cx="104" cy="270" rx="7" ry="2.2"/>
          <g class="ball-x">
            <g class="ball-y">
              <g class="ball-spin">
                <circle class="ball" cx="104" cy="262.5" r="7"/>
                <polygon class="ball-patch" points="104,259.9 106.5,261.7 105.5,264.6 102.5,264.6 101.5,261.7"/>
                <path class="ball-seam" d="M104 259.9V256.4M106.5 261.7L109.8 260.6M105.5 264.6L107.6 267.4M102.5 264.6L100.4 267.4M101.5 261.7L98.2 260.6"/>
              </g>
            </g>
          </g>

          <!-- boombox di atap gedung 1 + nada musik -->
          <g class="boombox">
            <path class="box-handle" d="M142 153Q151 144 160 153"/>
            <rect class="box" x="137" y="153" width="28" height="13" rx="3"/>
            <circle class="spk" cx="144" cy="159.5" r="4"/>
            <circle class="spk" cx="158" cy="159.5" r="4" style="animation-delay:-.1s"/>
          </g>
          <g transform="translate(150 146)">
            <g class="note" style="--t:3.6s;--delay:0s;--dx:-16px">
              <ellipse cx="0" cy="0" rx="4.4" ry="3.3" transform="rotate(-22)"/>
              <path fill="none" d="M3.7-1.6V-17l7.5 2.6"/>
            </g>
          </g>
          <g transform="translate(152 146)">
            <g class="note" style="--t:3.9s;--delay:1.25s;--dx:12px">
              <ellipse cx="0" cy="0" rx="4" ry="3" transform="rotate(-22)"/>
              <ellipse cx="11" cy="-2" rx="4" ry="3" transform="rotate(-22 11 -2)"/>
              <path fill="none" d="M3.4-1.5V-16M14.4-3.5V-18M3.4-16L14.4-18"/>
            </g>
          </g>
          <g transform="translate(148 146)">
            <g class="note" style="--t:3.4s;--delay:2.4s;--dx:-6px">
              <ellipse cx="0" cy="0" rx="4.4" ry="3.3" transform="rotate(-22)"/>
              <path fill="none" d="M3.7-1.6V-17l7.5 2.6"/>
            </g>
          </g>

          <!-- rel kereta -->
          <line class="rail" x1="0" y1="298" x2="520" y2="298"/>
          <line class="sleepers" x1="0" y1="302" x2="520" y2="302"/>

          <!-- kereta berwajah lucu (klik untuk "Tuut!") -->
          <g transform="translate(0 298)">
            <g class="train">
              <rect class="chassis" x="0" y="-14" width="172" height="5" rx="2"/>

              <rect class="car" x="0" y="-42" width="50" height="30" rx="7"/>
              <rect class="cwin" x="6" y="-35" width="11" height="10" rx="2.5"/>
              <rect class="cwin" x="19" y="-35" width="11" height="10" rx="2.5"/>
              <rect class="cwin" x="32" y="-35" width="11" height="10" rx="2.5"/>

              <rect class="car" x="54" y="-42" width="50" height="30" rx="7"/>
              <rect class="cwin" x="60" y="-35" width="11" height="10" rx="2.5"/>
              <rect class="cwin" x="73" y="-35" width="11" height="10" rx="2.5"/>
              <rect class="cwin" x="86" y="-35" width="11" height="10" rx="2.5"/>

              <rect class="coupler" x="50" y="-26" width="4" height="3"/>
              <rect class="coupler" x="104" y="-26" width="4" height="3"/>

              <rect class="cabin" x="108" y="-52" width="24" height="40" rx="5"/>
              <rect class="cab-roof" x="106" y="-56" width="28" height="6" rx="3"/>
              <rect class="cab-win" x="113" y="-44" width="14" height="11" rx="2.5"/>

              <rect class="chimney" x="152" y="-54" width="9" height="16" rx="2"/>
              <rect class="chimney-cap" x="150" y="-57" width="13" height="4" rx="2"/>
              <rect class="boiler" x="130" y="-40" width="42" height="28" rx="12"/>
              <circle class="steam-dome" cx="141" cy="-41" r="5"/>

              <g class="eyes">
                <circle class="eye" cx="157" cy="-29" r="3.3"/>
                <circle class="eye" cx="166" cy="-29" r="3.3"/>
                <circle class="pupil" cx="158" cy="-29" r="1.7"/>
                <circle class="pupil" cx="167" cy="-29" r="1.7"/>
              </g>
              <circle class="cheek" cx="153" cy="-22" r="2.4"/>
              <circle class="cheek" cx="170" cy="-22" r="2.4"/>
              <path class="smile" d="M157 -21.5q4.5 4 9 0"/>

              <g transform="translate(10 -6)"><g class="wheel"><circle r="6"/><path d="M-6 0H6M0-6V6"/></g></g>
              <g transform="translate(40 -6)"><g class="wheel"><circle r="6"/><path d="M-6 0H6M0-6V6"/></g></g>
              <g transform="translate(64 -6)"><g class="wheel"><circle r="6"/><path d="M-6 0H6M0-6V6"/></g></g>
              <g transform="translate(94 -6)"><g class="wheel"><circle r="6"/><path d="M-6 0H6M0-6V6"/></g></g>
              <g transform="translate(116 -6)"><g class="wheel"><circle r="6"/><path d="M-6 0H6M0-6V6"/></g></g>
              <g transform="translate(139 -6)"><g class="wheel"><circle r="6"/><path d="M-6 0H6M0-6V6"/></g></g>
              <g transform="translate(162 -6)"><g class="wheel"><circle r="6"/><path d="M-6 0H6M0-6V6"/></g></g>

              <g transform="translate(156.5 -60)">
                <circle class="puff" r="4" style="--delay:0s"/>
                <circle class="puff" r="4" style="--delay:.8s"/>
                <circle class="puff" r="4" style="--delay:1.6s"/>
              </g>

              <g transform="translate(150 -72)">
                <g class="bubble">
                  <rect x="-26" y="-22" width="52" height="24" rx="12"/>
                  <path d="M-5 1.5L0 9 5 1.5Z"/>
                  <text x="0" y="-5.5" text-anchor="middle">Tuut!</text>
                </g>
              </g>
            </g>
          </g>
        </svg>
      </div>
    </section>

    <div id="filters" class="filters glass" role="group" aria-label="Filter kategori"></div>

    <section id="gallery" class="gallery" aria-live="polite"></section>

    <p id="empty" class="empty glass" hidden>
      Belum ada karya. Buka <a href="/admin/">/admin</a> untuk menambahkan karya pertamamu.
    </p>
  </main>

  <footer class="wrap">
    <div class="foot glass">
      <a id="contact-email" href="#"></a>
      <a id="contact-ig" href="#" target="_blank" rel="noopener"></a>
    </div>
  </footer>

  <dialog id="viewer" class="viewer" aria-label="Detail karya">
    <button class="v-close" type="button" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="v-nav v-prev" type="button" aria-label="Karya sebelumnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <figure class="v-fig">
      <div class="v-frame glass">
        <img id="v-img" alt="">
      </div>
      <figcaption class="v-cap glass">
        <strong id="v-title"></strong>
        <span id="v-meta"></span>
        <p id="v-desc"></p>
      </figcaption>
    </figure>
    <button class="v-nav v-next" type="button" aria-label="Karya berikutnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </dialog>

  <!-- Pintu admin: pertanyaan trivia atau passkey 6 digit (diatur di content/gate.json) -->
  <dialog id="gate" class="gate" aria-labelledby="gate-title">
    <div class="gate-card glass">
      <button class="icon-btn gate-x" type="button" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2.5"/>
          <path class="sh-closed" d="M8 11V8a4 4 0 0 1 8 0v3"/>
          <path class="sh-open" d="M8 11V8a4 4 0 0 1 7.5-2"/>
        </svg>
      </div>
      <h2 id="gate-title">Pintu admin</h2>
      <p id="gate-q" class="gate-q"></p>
      <form id="gate-form" class="gate-form" novalidate>
        <input id="gate-input" class="gate-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Jawaban">
        <div id="gate-dots" class="dots" hidden>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <input id="gate-pin" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Passkey 6 digit">
        </div>
        <p id="gate-msg" class="gate-msg" role="alert"></p>
        <button id="gate-go" class="btn gate-go" type="submit">Buka</button>
      </form>
    </div>
  </dialog>

  <script src="gate.js"></script>
  <script src="app.js"></script>
</body>
</html>
